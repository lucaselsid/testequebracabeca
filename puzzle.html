<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quebra-Cabeça</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --accent: #2563eb;
    --accent2: #16a34a;
    --text: #1f2937;
    --border: #d1d5db;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --border: #374151;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111827;
    --card: #1f2937;
    --text: #f3f4f6;
    --border: #374151;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    gap: 16px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0;
    text-align: center;
  }
  .status {
    font-size: 0.95rem;
    color: var(--accent);
    min-height: 1.3em;
    font-weight: 600;
    text-align: center;
  }
  .board-outer {
    position: relative;
    width: min(90vw, 420px);
    aspect-ratio: 1 / 1;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    touch-action: none;
    overflow: hidden;
  }
  .board-inner {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
  }
  .piece {
    position: absolute;
    cursor: grab;
  }
  .piece.dragging {
    cursor: grabbing;
    z-index: 999 !important;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
  }
  .piece-img {
    position: absolute;
    background-repeat: no-repeat;
    pointer-events: none;
  }
  .cell-highlight {
    position: absolute;
    border: 3px solid var(--accent);
    border-radius: 6px;
    pointer-events: none;
    display: none;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .preview {
    width: 90px;
    border-radius: 8px;
    border: 2px solid var(--border);
    opacity: 0.9;
  }
  .hint {
    font-size: 0.8rem;
    opacity: 0.7;
    text-align: center;
    max-width: 420px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧩 Monte o quebra-cabeça (9 peças)</h1>
  <img class="preview" id="preview" alt="prévia" />
  <div class="status" id="status">Arraste as peças para o lugar certo</div>
  <div class="board-outer" id="boardOuter">
    <div class="board-inner" id="boardInner"></div>
    <svg width="0" height="0" style="position:absolute">
      <defs id="clipDefs"></defs>
    </svg>
  </div>
  <div class="controls">
    <button id="shuffleBtn">Embaralhar</button>
    <button class="secondary" id="solveBtn">Ver solução</button>
  </div>
  <div class="hint">Arraste (ou toque e arraste no celular) uma peça sobre outra para trocá-las de lugar.</div>
</div>

const N = 3;
const BASE = 360;          // internal pixel size of the board (square)
const CELL = BASE / N;
const TAB = CELL * 0.22;   // tab bump depth

const boardOuter = document.getElementById("boardOuter");
const boardInner = document.getElementById("boardInner");
const clipDefs = document.getElementById("clipDefs");
const statusEl = document.getElementById("status");
document.getElementById("preview").src = IMG_SRC;

boardInner.style.width = BASE + "px";
boardInner.style.height = BASE + "px";

// ---- deterministic-ish random (fixed seed so shapes are stable) ----
let seed = 42;
function rnd() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

// Edge sign matrices: horizontal edges (between rows) and vertical edges (between cols)
const rowEdges = []; // [N-1][N]  sign for edge between piece(r,c)-bottom and piece(r+1,c)-top
for (let r = 0; r < N - 1; r++) {
  const row = [];
  for (let c = 0; c < N; c++) row.push(rnd() > 0.5 ? 1 : -1);
  rowEdges.push(row);
}
const colEdges = []; // [N][N-1] sign for edge between piece(r,c)-right and piece(r,c+1)-left
for (let r = 0; r < N; r++) {
  const row = [];
  for (let c = 0; c < N - 1; c++) row.push(rnd() > 0.5 ? 1 : -1);
  colEdges.push(row);
}

function edgeSigns(r, c) {
  const top = r === 0 ? 0 : -rowEdges[r - 1][c];
  const bottom = r === N - 1 ? 0 : rowEdges[r][c];
  const left = c === 0 ? 0 : -colEdges[r][c - 1];
  const right = c === N - 1 ? 0 : colEdges[r][c];
  return { top, right, bottom, left };
}

function bumpSeg(p0, p1, sign, nx, ny, depth) {
  if (sign === 0) return `L ${p1.x} ${p1.y}`;
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  function pt(t, off) {
    off = off || 0;
    return { x: p0.x + dx * t + nx * off, y: p0.y + dy * t + ny * off };
  }
  const d = sign * depth;
  const A = pt(0.32);
  const c1 = pt(0.32, d * 0.95);
  const c2 = pt(0.40, d);
  const B = pt(0.5, d);
  const c3 = pt(0.60, d);
  const c4 = pt(0.68, d * 0.95);
  const C = pt(0.68);
  return `L ${A.x} ${A.y} C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${B.x} ${B.y} ` +
         `C ${c3.x} ${c3.y} ${c4.x} ${c4.y} ${C.x} ${C.y} L ${p1.x} ${p1.y}`;
}

function buildPieceGeometry(r, c) {
  const signs = edgeSigns(r, c);
  const pL = signs.left !== 0 ? TAB : 0;
  const pT = signs.top !== 0 ? TAB : 0;
  const pR = signs.right !== 0 ? TAB : 0;
  const pB = signs.bottom !== 0 ? TAB : 0;

  const w = CELL + pL + pR;
  const h = CELL + pT + pB;

  const TL = { x: pL, y: pT };
  const TR = { x: pL + CELL, y: pT };
  const BR = { x: pL + CELL, y: pT + CELL };
  const BL = { x: pL, y: pT + CELL };

  let d = `M ${TL.x} ${TL.y} `;
  d += bumpSeg(TL, TR, signs.top, 0, -1, TAB) + " ";
  d += bumpSeg(TR, BR, signs.right, 1, 0, TAB) + " ";
  d += bumpSeg(BR, BL, signs.bottom, 0, 1, TAB) + " ";
  d += bumpSeg(BL, TL, signs.left, -1, 0, TAB) + " Z";

  return {
    pL, pT, pR, pB,
    width: w,
    height: h,
    origR: r,
    origC: c,
    path: d
  };
}

let pieces = [];      // geometry per original piece index (0..8), fixed
let order = [];       // order[cellPos] = pieceIndex currently occupying that grid cell
let pieceEls = [];    // DOM element per piece index

function buildBoard() {
  boardInner.innerHTML = "";
  clipDefs.innerHTML = "";
  pieces = [];
  pieceEls = [];
  order = [];

  for (let i = 0; i < N * N; i++) order.push(i);

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const idx = r * N + c;
      const geo = buildPieceGeometry(r, c);
      pieces.push(geo);

      const clipId = "clip-" + idx;
      const clipPath = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
      clipPath.setAttribute("id", clipId);
      clipPath.setAttribute("clipPathUnits", "userSpaceOnUse");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", geo.path);
      clipPath.appendChild(path);
      clipDefs.appendChild(clipPath);

      const piece = document.createElement("div");
      piece.className = "piece";
      piece.dataset.pieceIndex = idx;
      piece.style.width = geo.width + "px";
      piece.style.height = geo.height + "px";
      piece.style.clipPath = `url(#${clipId})`;
      piece.style.zIndex = ((r + c) % 2 === 0) ? 2 : 1;

      const img = document.createElement("div");
      img.className = "piece-img";
      img.style.width = BASE + "px";
      img.style.height = BASE + "px";
      img.style.left = -(c * CELL - geo.pL) + "px";
      img.style.top = -(r * CELL - geo.pT) + "px";
      img.style.backgroundImage = `url(${IMG_SRC})`;
      img.style.backgroundSize = BASE + "px " + BASE + "px";
      piece.appendChild(img);

      boardInner.appendChild(piece);
      pieceEls.push(piece);
    }
  }
  layout();
  attachDrag();
}

function cellPos(idx) { return { r: Math.floor(idx / N), c: idx % N }; }

function layout() {
  for (let cellIdx = 0; cellIdx < N * N; cellIdx++) {
    const pieceIdx = order[cellIdx];
    const { r, c } = cellPos(cellIdx);
    const geo = pieces[pieceIdx];
    const el = pieceEls[pieceIdx];
    el.style.left = (c * CELL - geo.pL) + "px";
    el.style.top = (r * CELL - geo.pT) + "px";
    el.dataset.cell = cellIdx;
  }
  checkWin();
}

function checkWin() {
  const solved = order.every((v, i) => v === i);
  statusEl.textContent = solved ? "🎉 Parabéns, você completou o quebra-cabeça!" : "Arraste as peças para o lugar certo";
}

function shuffle() {
  do {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } while (order.every((v, i) => v === i));
  layout();
}

function solve() {
  order = order.map((_, i) => i);
  layout();
}

// ---- scaling to fit responsive wrapper ----
let scale = 1;
function updateScale() {
  const w = boardOuter.clientWidth;
  scale = w / BASE;
  boardInner.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", updateScale);

// ---- drag & drop (pointer events) ----
let dragPieceIdx = null;
let dragStartCell = null;

function pointToCell(clientX, clientY) {
  const rect = boardOuter.getBoundingClientRect();
  const x = (clientX - rect.left) / scale;
  const y = (clientY - rect.top) / scale;
  let c = Math.floor(x / CELL);
  let r = Math.floor(y / CELL);
  c = Math.max(0, Math.min(N - 1, c));
  r = Math.max(0, Math.min(N - 1, r));
  return r * N + c;
}

function attachDrag() {
  pieceEls.forEach((el) => {
    el.addEventListener("pointerdown", (e) => {
      const idx = parseInt(el.dataset.pieceIndex);
      dragPieceIdx = idx;
      dragStartCell = parseInt(el.dataset.cell);
      el.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointerup", (e) => {
      if (dragPieceIdx === null) return;
      el.classList.remove("dragging");
      const targetCell = pointToCell(e.clientX, e.clientY);
      if (targetCell !== dragStartCell) {
        const otherPieceIdx = order[targetCell];
        order[targetCell] = dragPieceIdx;
        order[dragStartCell] = otherPieceIdx;
        layout();
      } else {
        layout();
      }
      dragPieceIdx = null;
      dragStartCell = null;
    });
    el.addEventListener("pointercancel", () => {
      if (dragPieceIdx !== null) {
        pieceEls[dragPieceIdx].classList.remove("dragging");
      }
      dragPieceIdx = null;
      dragStartCell = null;
      layout();
    });
  });
}

document.getElementById("shuffleBtn").addEventListener("click", shuffle);
document.getElementById("solveBtn").addEventListener("click", solve);

buildBoard();
updateScale();
shuffle();
</script>
